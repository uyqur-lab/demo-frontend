name: ci
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Testlar
        run: |
          if ls test/*.test.js >/dev/null 2>&1; then
            node --test
          else
            echo "Test fayli yo'q — o'tkazib yuborildi"
          fi
