name: ci
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AC_GATE_LAYER: FE
      AC_GATE_TEST_DIRS: test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Testlar
        run: node --test
      - name: AC gate
        run: bash .github/scripts/ac-gate.sh
