<!doctype html>
<meta charset="utf-8">
<title>Uyqur</title>
<style>
  /* Sahifa o'z rangini o'zi belgilaydi — brauzer mavzusiga tayanmaydi. */
  :root {
    --bg: #ffffff;
    --ink: #16181d;
    --muted: #5b6270;
    --line: #d8dbe2;
    --accent: #2f6fed;
    --err: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --ink: #e6e9ee;
      --muted: #a2a9b5;
      --line: #2b2f36;
      --accent: #6f9bff;
      --err: #ff7a7a;
    }
  }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 24px; margin: 0 0 16px; }
  p { color: var(--muted); }
</style>
<h1>Uyqur</h1>
<p>Bo'sh sahifa. Funksiya hali qo'shilmagan.</p>
